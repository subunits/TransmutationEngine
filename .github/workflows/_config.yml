# _config.yml
title: Transmutation Engine
url: "https://subunits.github.io"
baseurl: "/TransmutationEngine"

# This forces the remote theme and ignores local defaults
remote_theme: jekyll/minima

# Force the professional dark skin
minima:
  skin: dark

# These plugins are MANDATORY for the theme to actually load
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed

# This tells Jekyll to ignore any leftover 'hacker' files 
# if you haven't deleted them yet
exclude:
  - assets/
  - _layouts/
  - css/
