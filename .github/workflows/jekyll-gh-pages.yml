name: Deploy Jekyll
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Forces Node 24 to stop the deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

# Kills any previous runs so they don't create multiple artifacts
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This injects the BLACK background and the COMMIT date into your README
      - name: Force Black Theme and Commit Info
        run: |
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d')
          echo -e "---\nlayout: default\n---\n<style>body,html,header,section,footer{background:#000!important;color:#eee!important}a{color:#0f0!important}</style>\n\n> **Last Commit:** $COMMIT_DATE\n\n$(cat README.md)" > README.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
