name: Deploy Midnight Dark

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Midnight Theme
        run: |
          # Clean slate
          rm -rf _layouts/ _includes/ assets/ index.html
          
          # Force Midnight theme
          echo "theme: jekyll-theme-midnight" > _config.yml
          echo "title: Transmutation Engine" >> _config.yml
          
          # Create a long-form page to ensure scrolling works
          echo -e "---\nlayout: default\n---\n# Transmutation Engine\n\n### Status: Cohesive Dark Mode Active\n\nThis is the Midnight theme. It is a regular Jekyll theme that supports standard scrolling and professional formatting.\n\n" > index.md
          
          # Add content to force a scrollbar
          for i in {1..30}; do 
            echo "#### Sequence $i" >> index.md
            echo "Processing data stream... stability at 100%. No hacker remnants detected." >> index.md
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
