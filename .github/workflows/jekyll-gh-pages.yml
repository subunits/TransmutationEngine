name: Deploy Jekyll

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This forces Jekyll to ignore GitHub's "Hacker" memory
      - name: Purge GitHub Memory
        run: |
          rm -rf _layouts/ _includes/ assets/
          echo "theme: jekyll-theme-minimal" > _config.yml
          echo "remote_theme: jekyll/minima" >> _config.yml
          echo "minima: {skin: dark}" >> _config.yml
          echo -e "---\nlayout: home\n---\n# Transmutation Engine\nStatus: Dark Mode Engaged." > index.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
