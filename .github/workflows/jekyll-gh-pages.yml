name: Restore Default Theme

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reset to Default
        run: |
          # Kill the custom HTML and the old config
          rm -rf index.html _layouts/ _includes/ assets/ _config.yml
          
          # Set theme to the GitHub Default (Minima)
          echo "theme: minima" > _config.yml
          echo "title: Transmutation Engine" >> _config.yml
          
          # Create a standard markdown file
          echo -e "---\nlayout: home\n---\n# Transmutation Engine\n\nThis is the default GitHub Pages look. No custom CSS, no forced panels, no extra junk." > index.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
