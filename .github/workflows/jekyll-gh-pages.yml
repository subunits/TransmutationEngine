name: Deploy Jekyll Dark Force

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This creates the professional Dark Mode theme on the fly
      - name: Inject Dark Theme
        run: |
          echo 'remote_theme: jekyll/minima' > _config.yml
          echo 'minima: {skin: dark}' >> _config.yml
          echo 'plugins: [jekyll-remote-theme]' >> _config.yml
          echo -e "---\nlayout: home\n---\n# Transmutation Engine\nClean Dark Mode Active." > index.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
