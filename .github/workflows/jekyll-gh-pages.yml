name: Deploy Cayman Slate Theme

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theme Config
        run: |
          # Kill old files
          rm -rf index.html _layouts/ _includes/
          
          # Set the standard dark theme
          echo "remote_theme: pages-themes/cayman-slate@v0.2.0" > _config.yml
          echo "plugins: [jekyll-remote-theme]" >> _config.yml
          echo "title: Transmutation Engine" >> _config.yml
          
          # Create the homepage
          echo -e "---\nlayout: default\n---\n# Transmutation Engine\n\nThis is a cohesive, dark-mode interface. Clean, regular, and professional." > index.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
