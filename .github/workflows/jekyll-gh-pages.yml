name: Deploy Jekyll

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force Professional Dark Theme
        run: |
          rm -rf _layouts/ _includes/ assets/ css/ index.html
          echo "remote_theme: pmarsceill/just-the-docs" > _config.yml
          echo "color_scheme: dark" >> _config.yml
          echo -e "---\nlayout: default\ntitle: Home\nnav_order: 1\n---\n# Transmutation Engine\n\n### System Status: Professional\nThis is the high-fidelity dark theme. No green text, no boring blog layout." > index.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
