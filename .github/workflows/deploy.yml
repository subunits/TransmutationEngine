name: Pure Black Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Black Page
        run: |
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d')
          # This creates a standalone, pure black HTML file from your README
          echo "<html><head><meta charset='UTF-8'><style>
          body { background: #000; color: #eee; font-family: -apple-system, sans-serif; padding: 40px; line-height: 1.6; max-width: 800px; margin: 0 auto; }
          h1, h2, h3 { color: #fff; border-bottom: 1px solid #333; padding-bottom: 8px; }
          pre { background: #111; padding: 15px; border-radius: 4px; overflow-x: auto; border: 1px solid #444; }
          code { background: #222; color: #ff7b72; padding: 2px 4px; border-radius: 3px; }
          a { color: #58a6ff; text-decoration: none; }
          .meta { color: #666; font-family: monospace; margin-bottom: 30px; font-size: 0.8rem; }
          </style></head><body>
          <div class='meta'>LAST_COMMIT: $COMMIT_DATE</div>" > index.html
          
          # Convert Markdown to HTML and append it
          npx lowdown README.md >> index.html
          
          echo "</body></html>" >> index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
